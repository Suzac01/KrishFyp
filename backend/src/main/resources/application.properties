server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/govweb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
app.seed-admin.enabled=${SEED_ADMIN_ENABLED:true}
app.seed-admin.email=${ADMIN_EMAIL:admin@govweb.local}
app.seed-admin.password=${ADMIN_PASSWORD:Admin@12345}


POSTGRES_DB=govweb
POSTGRES_USER=postgres
POSTGRES_PASSWORD=123
SEED_ADMIN_ENABLED=true
ADMIN_EMAIL=admin@govweb.local
ADMIN_PASSWORD=Admin@12345